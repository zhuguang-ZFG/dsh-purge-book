name: build-book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: pandoc/actions/setup@v1
      - uses: browser-actions/setup-chrome@v1
        id: chrome

      - name: Install check dependency
        run: python -m pip install pypdf==6.21.2

      - name: Install diagram renderer
        working-directory: build
        run: PUPPETEER_SKIP_DOWNLOAD=1 bun install --frozen-lockfile

      - name: Build PDF and EPUB
        run: bash build/build.sh
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Assert book artifacts
        run: python build/check_book.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: book
          path: |
            dist/chaizha.pdf
            dist/chaizha.epub
