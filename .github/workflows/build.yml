name: build-book

on:
  push:
    branches: [main, 'acceptance/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: book-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - uses: pandoc/actions/setup@v1
        with:
          version: '3.14'
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: '158.0.8127.36'

      - name: Install check dependency
        run: python -m pip install pypdf==6.21.2 PyMuPDF==1.28.0 fonttools==4.66.1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Chinese fonts
        timeout-minutes: 5
        run: |
          python build/prepare_fonts.py
          mkdir -p "$HOME/.local/share/fonts/chaizha"
          cp build/tmp/fonts/NotoSansSC-{Regular,Bold}.ttf "$HOME/.local/share/fonts/chaizha/"
          fc-cache -f
          [[ "$(fc-match -f '%{family}' 'Noto Sans SC')" == *"Noto Sans SC"* ]]

      - name: Install diagram renderer
        working-directory: build
        run: PUPPETEER_SKIP_DOWNLOAD=1 bun install --frozen-lockfile

      - uses: actions/checkout@v4
        with:
          repository: zhuguang-ZFG/dsh-purge-safe
          ref: cc881fbd68b891772330c6b0d275b0c971794e00
          path: build/tmp/reference-dsh
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: zhuguang-ZFG/pi-purge
          ref: 5cd5f3551fba1c7320751b825e9167da5af6c25e
          path: build/tmp/reference-pi
          persist-credentials: false

      - name: Check both source baselines and offline fixtures
        run: |
          python build/check_reference.py --reference build/tmp/reference-dsh --peer build/tmp/reference-pi
          python build/check_reference.py --reference build/tmp/reference-pi --baseline build/baseline-pi.json

      - name: Enforce pinned toolchain
        run: python build/check_toolchain.py --strict
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Build PDF and EPUB
        run: bash build/build.sh
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Assert book artifacts
        run: python build/check_book.py

      - name: Check teaching example and PDF pagination
        run: |
          python examples/label-task/verify.py
          python build/check_print.py

      - name: Validate EPUB package
        run: |
          curl --fail --location --silent --show-error https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip -o build/tmp/epubcheck.zip
          unzip -q build/tmp/epubcheck.zip -d build/tmp
          java -jar build/tmp/epubcheck-5.4.0/epubcheck.jar dist/chaizha.epub

      - name: Check illustrations and offline viewer
        run: bun build/check_artwork.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Check EPUB reader and print figure sizes
        run: bun build/check_reading.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Check EPUB with MuPDF
        run: python build/check_epub_mupdf.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book
          path: |
            dist/chaizha.pdf
            dist/chaizha.epub
            dist/illustrations.html
            build/tmp/book.html
            build/tmp/navigation.json
            build/tmp/pdf-navigation.json
            build/tmp/toolchain-check.json
            build/tmp/fonts/font-report.json
            build/tmp/toc-pages.json
            build/tmp/reading-check/*.json
            build/tmp/artwork-check/report.json
