<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拆闸 · 手绘插画册</title>
<style>
:root{color-scheme:light;--ink:#173f50;--muted:#526c70;--paper:#faf7ef;--line:#c9d1c7;--accent:#ad5538}
*{box-sizing:border-box}body{margin:0;background:#eeede6;color:var(--ink);font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}
main{max-width:1460px;margin:auto;padding:44px 36px 64px}header{display:flex;justify-content:space-between;align-items:end;gap:24px;border-bottom:1px solid var(--line);padding-bottom:28px;margin-bottom:32px}
.eyebrow{font:12px Consolas,monospace;letter-spacing:.12em;color:var(--muted)}h1{font:normal 42px KaiTi,STKaiti,serif;margin:14px 0}header p{margin:8px 0;color:var(--muted);line-height:1.7}
.index{font:16px Consolas,monospace;white-space:nowrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:40px 24px}figure{margin:0;min-width:0}
.open{display:block;background:var(--paper);padding:0;border:1px solid var(--line);width:100%;cursor:zoom-in;overflow:hidden}
.open img{display:block;width:100%;height:auto}.open:hover{border-color:var(--accent)}
figcaption{display:flex;justify-content:space-between;gap:16px;margin-top:12px;font-size:15px;line-height:1.6}
.plate-number{font:13px Consolas,monospace;color:var(--accent);margin-right:10px}a{color:var(--ink);text-underline-offset:4px;white-space:nowrap}
.caption{color:var(--muted);font-size:13px;line-height:1.8;max-width:65ch;margin:8px 0 0}
button{font:inherit}button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
footer{border-top:1px solid var(--line);margin-top:40px;padding-top:18px;color:var(--muted);font-size:13px;line-height:1.8}
dialog{border:1px solid var(--line);padding:0;width:1460px;max-width:96vw;height:92vh;max-height:96vh;overflow:hidden;background:var(--paper);color:var(--ink)}
dialog::backdrop{background:#173f50c9}dialog[open]{display:flex;flex-direction:column}
.viewer-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.viewer-heading{min-width:0}.viewer-heading h2{font:normal 23px KaiTi,STKaiti,serif;margin:0 0 5px}.counter{font:12px Consolas,monospace;color:var(--muted)}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.controls button{background:transparent;color:var(--ink);border:1px solid var(--line);padding:7px 11px;min-width:42px;min-height:38px;cursor:pointer}
.controls button:hover:not(:disabled){background:#e2e9e2}.controls button:disabled{opacity:.35;cursor:default}.controls .close{background:var(--ink);color:white;border-color:var(--ink)}
.controls output{font:13px Consolas,monospace;min-width:48px;text-align:center}
.stage{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;background:#e5e7de;cursor:grab;touch-action:pan-x pan-y}
.stage.dragging{cursor:grabbing}.canvas{display:grid;place-items:center;min-width:100%;min-height:100%;padding:16px}
.canvas img{display:block;flex:none;max-width:none;user-select:none;-webkit-user-drag:none;background:var(--paper)}
.viewer-note{padding:10px 18px;margin:0;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.6}
@media(max-width:800px){main{padding:24px 16px 40px}header{align-items:start}.index{display:none}h1{font-size:32px}.grid{grid-template-columns:1fr;gap:30px}.viewer-bar{padding:10px;gap:10px}.viewer-heading h2{font-size:20px}.controls{gap:5px}.controls button{padding:6px 9px}.viewer-note{padding:8px 10px}dialog{height:94vh;max-width:98vw}.caption{font-size:13px}}
@media print{body{background:white}main{padding:0}header,footer,.download,.caption{display:none}.grid{display:block}figure{break-inside:avoid;margin-bottom:18px}.open{border:0}dialog[open]{display:none}}
</style>
</head>
<body><main>
<header><div><p class="eyebrow">CHAIZHA / ILLUSTRATED ENGINEERING NOTES</p><h1>拆闸 · 手绘插画册</h1><p>卷首、八章章图与四张操作细节图。点击放大，核对图中的关系与标注。</p></div><p class="index">{{COUNT}} PLATES / SVG</p></header>
<div class="grid">{{CARDS}}</div>
<footer>可离线阅读。大图支持缩放、拖动与键盘翻图；下载的矢量图可继续编辑。</footer>
</main>
<dialog aria-labelledby="viewer-title" aria-describedby="viewer-help">
<div class="viewer-bar"><div class="viewer-heading"><h2 id="viewer-title"></h2><span class="counter" aria-live="polite"></span></div>
<div class="controls" aria-label="查看插图">
<button type="button" class="previous" aria-label="上一幅">←</button><button type="button" class="next" aria-label="下一幅">→</button>
<button type="button" class="zoom-out" aria-label="缩小">−</button><output aria-label="缩放比例" aria-live="polite"></output><button type="button" class="zoom-in" aria-label="放大">＋</button>
<button type="button" class="fit">适合窗口</button><button type="button" class="actual">原尺寸</button><button type="button" class="close" autofocus>关闭</button>
</div></div>
<div class="stage" tabindex="0" aria-label="插图画布，可滚动查看"><div class="canvas"><img alt="" draggable="false"></div></div>
<p class="viewer-note" id="viewer-help">拖动或滚动查看细节 · ← → 翻图 · ＋ − 缩放 · 0 适合窗口 · Esc 关闭</p>
</dialog>
<script>
const dialog=document.querySelector('dialog');
const stage=dialog.querySelector('.stage'), canvas=stage.querySelector('.canvas'), enlarged=canvas.querySelector('img');
const buttons=[...document.querySelectorAll('.open')];
const zoomOut=dialog.querySelector('.zoom-out'), zoomIn=dialog.querySelector('.zoom-in');
const previous=dialog.querySelector('.previous'), next=dialog.querySelector('.next');
let index=0, scale=1, fitted=true, opener=null, drag=null, savedOverflow='';
const clamp=(value,min,max)=>Math.min(max,Math.max(min,value));
const fitScale=()=>Math.min((stage.clientWidth-32)/1200,(stage.clientHeight-32)/660,1);
function renderScale(value,fit=false){
 const old=scale, centerX=stage.scrollLeft+stage.clientWidth/2, centerY=stage.scrollTop+stage.clientHeight/2;
 scale=clamp(value,.1,3);fitted=fit;
 enlarged.style.width=(1200*scale)+'px';enlarged.style.height=(660*scale)+'px';
 canvas.style.width=Math.max(stage.clientWidth,1200*scale+32)+'px';canvas.style.height=Math.max(stage.clientHeight,660*scale+32)+'px';
 stage.scrollLeft=fit?0:centerX*scale/old-stage.clientWidth/2;
 stage.scrollTop=fit?0:centerY*scale/old-stage.clientHeight/2;
 dialog.querySelector('output').value=Math.round(scale*100)+'%';
 zoomOut.disabled=scale<=.101;zoomIn.disabled=scale>=2.999;
 if((zoomOut.disabled&&document.activeElement===zoomOut)||(zoomIn.disabled&&document.activeElement===zoomIn))stage.focus({preventScroll:true});
}
function fit(){renderScale(fitScale(),true)}
function show(n){
 index=clamp(n,0,buttons.length-1);
 const source=buttons[index].querySelector('img');enlarged.src=source.src;enlarged.alt=source.alt;
 dialog.querySelector('h2').textContent=source.alt;dialog.querySelector('.counter').textContent=(index+1)+' / '+buttons.length;
 previous.disabled=index===0;next.disabled=index===buttons.length-1;
 if((previous.disabled&&document.activeElement===previous)||(next.disabled&&document.activeElement===next))stage.focus({preventScroll:true});
 fit();
}
buttons.forEach((button,n)=>button.addEventListener('click',()=>{
 opener=button;savedOverflow=document.body.style.overflow;document.body.style.overflow='hidden';dialog.showModal();show(n);
}));
dialog.querySelector('.close').addEventListener('click',()=>dialog.close());
dialog.addEventListener('close',()=>{document.body.style.overflow=savedOverflow;stopDrag();opener?.focus({preventScroll:true})});
previous.addEventListener('click',()=>show(index-1));next.addEventListener('click',()=>show(index+1));
zoomIn.addEventListener('click',()=>renderScale(scale*1.5));zoomOut.addEventListener('click',()=>renderScale(scale/1.5));
dialog.querySelector('.fit').addEventListener('click',fit);dialog.querySelector('.actual').addEventListener('click',()=>renderScale(1));
document.addEventListener('keydown',event=>{
 if(!dialog.open)return;
 const actions={ArrowLeft:()=>show(index-1),ArrowRight:()=>show(index+1),'+':()=>renderScale(scale*1.5),'=':()=>renderScale(scale*1.5),'-':()=>renderScale(scale/1.5),'0':fit};
 if(event.ctrlKey||event.metaKey||event.altKey)return;
 if(actions[event.key]){event.preventDefault();actions[event.key]()}
});
stage.addEventListener('pointerdown',event=>{
 if(event.pointerType!=='mouse'||event.button!==0)return;
 if(stage.scrollWidth<=stage.clientWidth&&stage.scrollHeight<=stage.clientHeight)return;
 drag={id:event.pointerId,x:event.clientX,y:event.clientY,left:stage.scrollLeft,top:stage.scrollTop};
 stage.setPointerCapture(event.pointerId);stage.classList.add('dragging');event.preventDefault();
});
stage.addEventListener('pointermove',event=>{if(drag){stage.scrollLeft=drag.left+drag.x-event.clientX;stage.scrollTop=drag.top+drag.y-event.clientY}});
function stopDrag(){if(drag&&stage.hasPointerCapture(drag.id))stage.releasePointerCapture(drag.id);drag=null;stage.classList.remove('dragging')}
stage.addEventListener('pointerup',stopDrag);stage.addEventListener('pointercancel',stopDrag);stage.addEventListener('lostpointercapture',()=>{drag=null;stage.classList.remove('dragging')});
new ResizeObserver(()=>{if(dialog.open){if(fitted)fit();else renderScale(scale)}}).observe(stage);
</script>
</body></html>
